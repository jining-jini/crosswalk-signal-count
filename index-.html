<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개신오거리 보행신호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --go:#1fa84f; --stop:#e23b3b; }
  /* 주간 / 야간 색 */
  body.day  { --bg:#f4f3ef; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1db; --card:#fff;
              --pill:rgba(255,255,255,.94); --pillInk:#1d1d1b; --clockBg:#fff; --clockLine:#1d1d1b; }
  body.night{ --bg:#1b1c20; --ink:#f2f2f0; --muted:#a3a39f; --line:#3a3b40; --card:#26272c;
              --pill:rgba(28,29,33,.92); --pillInk:#fff; --clockBg:#26272c; --clockLine:#f2f2f0; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto}

  /* ---------- 지도 + 겹쳐 올리는 표시 (러프 스케치 배치 그대로) ---------- */
  .map{
    position:relative; width:100%; aspect-ratio:3 / 4;      /* 지도 그림 비율 */
    background:#888 center / 100% 100% no-repeat;
    container-type:inline-size;           /* cqw = 지도 너비의 1% */
    overflow:hidden;
  }
  body.day   .map{ background-image:url("map-day.jpg"); }
  body.night .map{ background-image:url("map-night.jpg"); }

  .sig{ position:absolute; transform:translate(-50%,-50%); }
  .dot{
    width:7.2cqw; height:7.2cqw; border-radius:50%;
    display:grid; place-items:center; background:var(--stop); color:#fff;
    font-weight:800; font-size:3.3cqw; font-variant-numeric:tabular-nums; letter-spacing:-.1cqw;
    box-shadow:0 .3cqw 1cqw rgba(0,0,0,.3);
  }
  .sig.go .dot{ background:var(--go); }

  /* 다음·다다음 녹색 시각: 상자 없이 글자만 (테두리 효과로 지도 위에서도 읽히게) */
  .times{
    position:absolute; white-space:nowrap;
    font-size:2.35cqw; font-weight:800; line-height:1.3; font-variant-numeric:tabular-nums;
    color:var(--tInk); text-shadow:0 0 .35cqw var(--tHalo), 0 0 .35cqw var(--tHalo), 0 0 .7cqw var(--tHalo);
  }
  body.day   { --tInk:#111; --tHalo:#fff; }
  body.night { --tInk:#fff; --tHalo:#000; }

  .clock{
    position:absolute; left:23.9%; top:85.7%; width:51.1%; height:11.1%;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    border:.6cqw solid var(--clockLine); border-radius:.8cqw;
    background:var(--clockFill); color:var(--clockInk); font-variant-numeric:tabular-nums;
  }
  body.day   { --clockLine:#111; --clockFill:rgba(255,255,255,.75); --clockInk:#111; }
  body.night { --clockLine:#fff; --clockFill:rgba(20,21,25,.55);   --clockInk:#fff; }
  .clock .t{ font-size:7.6cqw; font-weight:800; line-height:1; letter-spacing:.1cqw; }
  .clock .t small{ font-size:3.6cqw; font-weight:700; opacity:.75; }
  .clock .d{ font-size:2.1cqw; opacity:.7; margin-top:.8cqw; }

  .sync{ position:absolute; left:2cqw; top:2cqw; right:2cqw; font-size:2.8cqw; padding:1cqw 1.8cqw; border-radius:1.4cqw; background:#fff4dc; color:#7a5600; }
  .sync.hide{ display:none; }

  /* ---------- 지도 아래: 관리용 ---------- */
  .below{ padding:14px 16px 32px; }
  details{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  summary{ cursor:pointer; font-weight:500; font-size:14px; }
  .syncrow{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  button{ font:inherit; font-size:12px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  th{ font-weight:500; color:var(--muted); text-align:left; padding:4px 0; }
  td{ padding:4px 0; }
  td input{ width:72px; font:inherit; padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .hint{ font-size:12px; color:var(--muted); line-height:1.6; margin:10px 0 0; }
  .note{ font-size:12px; color:var(--muted); line-height:1.6; margin:12px 2px 0; }
</style>
</head>
<body class="day">
<main>
  <div class="map" id="map">
    <div class="sync" id="sync"></div>
    <div class="clock"><div class="t" id="clock">--:--:--</div><div class="d" id="date"></div></div>
  </div>

  <div class="below">
    <details id="details">
      <summary id="summary">시간 맞추기 · 신호 시간 설정</summary>
      <p class="hint">지금 <b id="modeName"></b> 계획을 고칩니다. 현장에서 녹색이 막 켜지는 순간 그 횡단보도 버튼을 누르세요.</p>
      <div class="syncrow" id="syncrow"></div>
      <table>
        <thead><tr><th>횡단보도</th><th>녹색 (초)</th><th>다음까지 (초)</th></tr></thead>
        <tbody id="cfg"></tbody>
      </table>
      <table><tbody><tr><td>실제 주기 C (초)</td><td><input type="number" min="1" step="0.01" id="cIn"></td><td></td></tr></tbody></table>
      <p class="hint" id="cycle"></p>
      <button id="reset" style="margin-top:8px">이 모드 기본값으로 되돌리기</button>
    </details>
    <p class="note">계산값이라 실제 신호와 다를 수 있습니다. 건널 때는 반드시 실제 신호등을 보세요.</p>
  </div>
</main>

<script>
/* =====================================================================
   1. 데이터
   ===================================================================== */

// 횡단보도 5개 (시계방향 순서). 위치는 러프 스케치 기준
// x, y   = 지도 그림 위 신호 동그라미 중심 (그림 가로·세로의 %). 주간·야간 그림은 구도가 같음
// tx, ty = 시각 두 줄의 왼쪽 위 (같은 기준)
const CROSSWALKS = [
  { n: 1, name: "정문약국 앞",   x: 46.3, y: 41.1, tx: 50.6, ty: 37.9 },
  { n: 2, name: "빽다방 앞",     x: 64.0, y: 46.9, tx: 68.2, ty: 43.6 },
  { n: 3, name: "집 앞",         x: 60.3, y: 57.8, tx: 62.8, ty: 60.2 },
  { n: 4, name: "대학약국 쪽",   x: 44.8, y: 57.5, tx: 42.0, ty: 60.6 },
  { n: 5, name: "충북대병원 쪽", x: 38.0, y: 46.7, tx: 32.9, ty: 49.8 },
];

// 화면(지도 색) 전환 시각 (시): DISPLAY_DAY_START 이상 ~ DISPLAY_NIGHT_START 미만이 밝은 지도
const DISPLAY_DAY_START = 6, DISPLAY_NIGHT_START = 18;

// 신호 계획 전환 시각 (시): PLAN_DAY_START 이상 ~ PLAN_NIGHT_START 미만이 주간(180초) 계획
// ※ 추정값. 06:24에는 아직 170초, 12:41에는 180초였음 → 실제 전환은 그 사이 어딘가 (확인 필요)
const PLAN_DAY_START = 7, PLAN_NIGHT_START = 18;

// 모드별 신호 계획. g = 녹색(깜빡임 포함), d = 꺼지고 다음 번호가 켜질 때까지, C = 실제 주기 (초)
// t0 = 1번 녹색이 켜진 실제 시각 (이 시각부터 C초마다 반복)
const DEFAULT_PLANS = {
  // 야간: 2026-11-14 06:24 영상 실측 (프레임 단위). 1번 녹색 켜짐 06:25:01.4 (±0.5초)
  night: {
    g: [32.82, 21.87, 32.80, 25.79, 27.80],
    d: [ 7.13,  5.18,  6.24,  5.19,  5.20],
    C: 170,
    t0: new Date("2026-11-14T06:25:01.400+09:00").getTime(),
  },
  // 주간: 주기 180초만 실측 (11/13 12:41). 녹색·간격은 야간 값을 비율대로 늘린 임시값, 기준 시각 미측정
  day: {
    g: [32.82, 21.87, 32.80, 25.79, 27.80],
    d: [ 7.13,  5.18,  6.24,  5.19,  5.20],
    C: 180,
    t0: null,
  },
};

/* =====================================================================
   2. 계산
   ===================================================================== */

function displayAt(ms) {                 // 지도 색: "day" / "night"
  const h = new Date(ms).getHours();
  return (h >= DISPLAY_DAY_START && h < DISPLAY_NIGHT_START) ? "day" : "night";
}
function planAt(ms) {                    // 신호 계획: "day"(180초) / "night"(170초)
  const h = new Date(ms).getHours();
  return (h >= PLAN_DAY_START && h < PLAN_NIGHT_START) ? "day" : "night";
}

function schedule(plan) {
  let S = 0;
  for (let k = 0; k < 5; k++) S += plan.g[k] + plan.d[k];
  const C = plan.C > 0 ? plan.C : S;
  const f = C / S;                       // 측정 합계를 실제 주기에 맞추는 비율
  const s = [], e = [];
  let t = 0;
  for (let k = 0; k < 5; k++) {
    s[k] = t;                            // k번 녹색 시작 (주기 안 몇 초째)
    e[k] = t + plan.g[k] * f;            // k번 녹색 끝
    t += (plan.g[k] + plan.d[k]) * f;
  }
  return { s, e, C, S };
}

// 지금(nowMs) k번 상태
//   green    : 지금 녹색인가
//   leftNow  : 지금 상태가 끝날 때까지 남은 초 (동그라미 숫자)
//   toGreen1 : 다음 녹색 켜짐까지 남은 초, toGreen2 : 다다음 녹색 켜짐까지
function signalState(nowMs, t0Ms, sch, k) {
  const { s, e, C } = sch;
  let phi = ((nowMs - t0Ms) / 1000) % C;
  if (phi < 0) phi += C;
  const green = (phi >= s[k] && phi < e[k]);

  let toGreen1 = s[k] - phi;
  if (toGreen1 <= 0) toGreen1 += C;      // 이미 켜졌으면 다음 주기
  const toGreen2 = toGreen1 + C;
  const leftNow = green ? e[k] - phi : toGreen1;
  return { green, leftNow, toGreen1, toGreen2 };
}

/* =====================================================================
   3. 설정 저장 (방문자 브라우저에만)
   ===================================================================== */

const KEY = "gaesin-signal-v6";
const clone = o => JSON.parse(JSON.stringify(o));
let plans = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    if (v && v.day && v.night) return v;
  } catch (err) {}
  return clone(DEFAULT_PLANS);
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(plans)); } catch (err) {} }

/* =====================================================================
   4. 화면 만들기
   ===================================================================== */

const pad = (x, n = 2) => String(x).padStart(n, "0");
const hms = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

const map = document.getElementById("map");
const ui = CROSSWALKS.map(c => {
  const sig = document.createElement("div");
  sig.className = "sig";
  sig.style.left = c.x + "%"; sig.style.top = c.y + "%";
  sig.title = `${c.n}번 ${c.name}`;
  sig.innerHTML = `<div class="dot"></div>`;
  map.appendChild(sig);

  const times = document.createElement("div");
  times.className = "times";
  times.style.left = c.tx + "%"; times.style.top = c.ty + "%";
  times.innerHTML = `<div class="l1"></div><div class="l2"></div>`;
  map.appendChild(times);

  return { sig, dot: sig.querySelector(".dot"), l1: times.querySelector(".l1"), l2: times.querySelector(".l2") };
});

// 관리 메뉴 (현재 모드의 계획을 고침)
let shownMode = null;
function buildAdmin(mode) {
  shownMode = mode;
  const plan = plans[mode];
  document.getElementById("modeName").textContent = mode === "day" ? `주간(${pad(PLAN_DAY_START)}~${pad(PLAN_NIGHT_START)}시, ${plans.day.C}초)` : `야간(${pad(PLAN_NIGHT_START)}~${pad(PLAN_DAY_START)}시, ${plans.night.C}초)`;

  const syncrow = document.getElementById("syncrow");
  syncrow.innerHTML = "";
  CROSSWALKS.forEach((c, k) => {
    const b = document.createElement("button");
    b.textContent = `${c.n}번 ${c.name} 지금 켜짐`;
    b.addEventListener("click", () => {
      const sch = schedule(plans[mode]);
      plans[mode].t0 = Date.now() - sch.s[k] * 1000;   // k번이 지금 켜짐 = 1번은 s[k]초 전에 켜짐
      save();
    });
    syncrow.appendChild(b);
  });

  const tbody = document.getElementById("cfg");
  tbody.innerHTML = "";
  CROSSWALKS.forEach((c, k) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${c.n}번 ${c.name}</td>
      <td><input type="number" min="1" step="0.1" value="${plan.g[k]}" data-f="g"></td>
      <td><input type="number" min="0" step="0.1" value="${plan.d[k]}" data-f="d"></td>`;
    tr.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (!isNaN(v) && v >= 0) { plans[mode][inp.dataset.f][k] = v; save(); }
    }));
    tbody.appendChild(tr);
  });

  const cIn = document.getElementById("cIn");
  cIn.value = plan.C;
  cIn.oninput = () => { const v = parseFloat(cIn.value); if (!isNaN(v) && v > 0) { plans[mode].C = v; save(); } };
  document.getElementById("reset").onclick = () => {
    const t0 = plans[mode].t0;
    plans[mode] = clone(DEFAULT_PLANS[mode]); plans[mode].t0 = t0;
    save(); buildAdmin(mode);
  };
}

/* =====================================================================
   5. 매 프레임 갱신
   ===================================================================== */

const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
let lastSig = 0;

function frame() {
  const now = Date.now();
  const d = new Date(now);
  const view = displayAt(now);           // 지도 색
  const mode = planAt(now);              // 신호 계획

  if (document.body.className !== view) document.body.className = view;
  if (shownMode !== mode) buildAdmin(mode);

  // 시계 (매 프레임, 밀리초까지)
  document.getElementById("clock").innerHTML = `${hms(now)}<small>.${pad(d.getMilliseconds(), 3)}</small>`;
  document.getElementById("date").textContent = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${WEEK[d.getDay()]}) · ${mode === "day" ? "주간" : "야간"} 신호 ${plans[mode].C}초`;

  // 신호 (0.1초마다)
  if (now - lastSig >= 100) {
    lastSig = now;
    const plan = plans[mode];
    const sch = schedule(plan);
    let t0 = plan.t0;
    const syncEl = document.getElementById("sync");
    if (t0 == null) {
      const m = new Date(); m.setHours(0, 0, 0, 0); t0 = m.getTime();
      syncEl.className = "sync";
      syncEl.textContent = `${mode === "day" ? "주간" : "야간"} 신호는 아직 기준 시각을 모릅니다. 숫자는 예시입니다.`;
    } else {
      syncEl.className = "sync hide";
    }
    document.getElementById("cycle").textContent = `측정값 합계 ${sch.S.toFixed(2)}초 → 실제 주기 ${sch.C.toFixed(2)}초에 맞춰 계산`;

    CROSSWALKS.forEach((c, k) => {
      const st = signalState(now, t0, sch, k);
      const u = ui[k];
      u.sig.classList.toggle("go", st.green);
      u.dot.textContent = Math.ceil(st.leftNow - 1e-6);
      u.l1.textContent = hms(now + st.toGreen1 * 1000);   // 다음 녹색 켜짐
      u.l2.textContent = hms(now + st.toGreen2 * 1000);   // 다다음 녹색 켜짐
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
