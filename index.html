<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개신오거리 보행신호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --go:#1fa84f; --stop:#e23b3b; }
  /* 주간 / 야간 색 */
  body.day  { --bg:#f4f3ef; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1db; --card:#fff;
              --pill:rgba(255,255,255,.94); --pillInk:#1d1d1b; --clockBg:#fff; --clockLine:#1d1d1b; }
  body.night{ --bg:#1b1c20; --ink:#f2f2f0; --muted:#a3a39f; --line:#3a3b40; --card:#26272c;
              --pill:rgba(28,29,33,.92); --pillInk:#fff; --clockBg:#26272c; --clockLine:#f2f2f0; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto}

  /* ---------- 지도 + 겹쳐 올리는 표시 (러프 스케치 배치 그대로) ---------- */
  .map{
    position:relative; width:100%; aspect-ratio:3 / 4;      /* 지도 그림 비율 */
    background:#888 center / 100% 100% no-repeat;
    container-type:inline-size;           /* cqw = 지도 너비의 1% */
    overflow:hidden;
  }
  body.day   .map{ background-image:url("map-day.jpg"); }
  body.night .map{ background-image:url("map-night.jpg"); }

  .sig{ position:absolute; transform:translate(-50%,-50%); }
  .dot{
    width:7.2cqw; height:7.2cqw; border-radius:50%;
    display:grid; place-items:center; background:var(--stop); color:#fff;
    font-weight:800; font-size:3.3cqw; font-variant-numeric:tabular-nums; letter-spacing:-.1cqw;
    box-shadow:0 .3cqw 1cqw rgba(0,0,0,.3);
  }
  .sig.go .dot{ background:var(--go); }

  /* 다음·다다음 녹색 시각: 상자 없이 글자만 (테두리 효과로 지도 위에서도 읽히게) */
  .times{
    position:absolute; white-space:nowrap;
    font-size:2.35cqw; font-weight:800; line-height:1.3; font-variant-numeric:tabular-nums;
    color:var(--tInk); text-shadow:0 0 .35cqw var(--tHalo), 0 0 .35cqw var(--tHalo), 0 0 .7cqw var(--tHalo);
  }
  body.day   { --tInk:#111; --tHalo:#fff; }
  body.night { --tInk:#fff; --tHalo:#000; }

  /* 화면 맨 아래 고정 시계: 화면 크기와 상관없이 같은 크기 (틀처럼 고정) */
  .clockbar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:#000; color:#fff; text-align:center;
    padding:14px 12px calc(12px + env(safe-area-inset-bottom));
    font-variant-numeric:tabular-nums;
  }
  .clockbar .t{ font-size:46px; font-weight:700; line-height:1.05; letter-spacing:1px; }
  .clockbar .t small{ font-size:30px; font-weight:700; }
  .clockbar .p{ font-size:12px; color:#9a9a9a; margin-top:4px; }
  body{ padding-bottom:120px; }

  .sync{ position:absolute; left:2cqw; top:2cqw; right:2cqw; font-size:2.8cqw; line-height:1.45; padding:1cqw 1.8cqw; border-radius:1.4cqw; background:#fff4dc; color:#7a5600; }
  .sync.hide{ display:none; }
  .sig.unk .dot{ background:#8a8a8a; }
  .dot.long{ font-size:2.4cqw; }
  
  /* ---------- 지도 아래: 데이터 출처 ---------- */
  .below{ padding:14px 16px 32px; }
  details{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  summary{ cursor:pointer; font-weight:500; font-size:14px; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px; }
  th{ font-weight:500; color:var(--muted); text-align:left; padding:5px 4px 5px 0; border-bottom:1px solid var(--line); }
  td{ padding:5px 4px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .hint{ font-size:12px; color:var(--muted); line-height:1.6; margin:10px 0 0; }
  .note{ font-size:12px; color:var(--muted); line-height:1.6; margin:12px 2px 0; }
</style>
</head>
<body class="day">
<main>
  <div class="map" id="map">
    <div class="sync hide" id="sync"></div>
  </div>

  <div class="below">
    <details>
      <summary>신호 계획 · 측정 근거</summary>
      <table>
        <thead><tr><th>시간대 (한국 시각)</th><th>주기</th><th>기준 (실측)</th></tr></thead>
        <tbody id="segTable"></tbody>
      </table>
      <table>
        <thead><tr><th>횡단보도</th><th>녹색</th><th>다음 신호까지 (주간 / 야간)</th></tr></thead>
        <tbody id="cwTable"></tbody>
      </table>
      <p class="hint">켜지는 순서: 5 → 1 → 2 → 3 → 4 → 다시 5. 지금은 하루 종일 180초 하나로 계산합니다.</p>
    </details>
    <p class="note">계산값이라 실제 신호와 다를 수 있습니다. 건널 때는 반드시 실제 신호등을 보세요.</p>
  </div>
</main>

<div class="clockbar"><div class="t" id="clock">--:--:--<small>.-</small></div><div class="p" id="plan"></div></div>

<script src="index1.js"></script>

</body>
</html>
