<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 브라우저 자체 확대는 막고, 지도 확대는 직접 처리 (그래야 아래 시계 크기가 그대로 유지됨) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>개신오거리 보행신호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --go:#1fa84f; --stop:#e23b3b; }
  /* 주간 / 야간 색 */
  body.day  { --bg:#f4f3ef; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1db; --card:#fff;
              --pill:rgba(255,255,255,.94); --pillInk:#1d1d1b; --tInk:#111; --tHalo:#fff; }
  body.night{ --bg:#1b1c20; --ink:#f2f2f0; --muted:#a3a39f; --line:#3a3b40; --card:#26272c;
              --pill:rgba(28,29,33,.92); --pillInk:#fff; --tInk:#fff; --tHalo:#000; }

  *{box-sizing:border-box}
  html{ height:100%; touch-action:manipulation; }      /* 두 번 탭 확대 막기 */
  body{
    margin:0; height:100vh; height:100dvh;               /* 화면 높이에 딱 맞춤 (스크롤 없음) */
    display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none;
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }

  /* ---------- 지도 보는 창 (시계 위 남은 공간 전부) ---------- */
  .viewer{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:var(--bg); }
  .pz{
    position:absolute; inset:0; overflow:hidden; touch-action:none;   /* 손가락 동작은 전부 직접 처리 */
    cursor:grab; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .pz:active{ cursor:grabbing; }

  /* 지도 판: 가로 1000px 기준으로 그리고, 확대·이동은 transform 으로만 */
  .stage{
    position:absolute; left:0; top:0; width:1000px; height:1333.333px;   /* 지도 비율 3:4 */
    transform-origin:0 0;
    background:#888 center / 100% 100% no-repeat;
    container-type:inline-size;            /* cqw = 지도 너비의 1% */
  }
  body.day   .stage{ background-image:url("map-day.jpg"); }
  body.night .stage{ background-image:url("map-night.jpg"); }

  /* 신호 표시: 동그라미 + 시각 두 줄을 한 묶음으로.
     --k 로 거꾸로 줄여서, 지도를 확대해도 화면에서 보이는 크기는 그대로 */
  .sig{
    position:absolute; width:7.2cqw; height:7.2cqw;
    transform:translate(-50%,-50%) scale(var(--k,1));
  }
  .dot{
    width:100%; height:100%; border-radius:50%;
    display:grid; place-items:center; background:var(--stop); color:#fff;
    font-weight:800; font-size:3.3cqw; font-variant-numeric:tabular-nums; letter-spacing:-.1cqw;
    box-shadow:0 .3cqw 1cqw rgba(0,0,0,.3);
  }
  .sig.go .dot{ background:var(--go); }
  .sig.unk .dot{ background:#8a8a8a; }
  .dot.long{ font-size:2.4cqw; }

  /* 다음·다다음 녹색 시각: 상자 없이 글자만 (테두리 효과로 지도 위에서도 읽히게) */
  .times{
    position:absolute; white-space:nowrap;
    font-size:2.35cqw; font-weight:800; line-height:1.3; font-variant-numeric:tabular-nums;
    color:var(--tInk); text-shadow:0 0 .35cqw var(--tHalo), 0 0 .35cqw var(--tHalo), 0 0 .7cqw var(--tHalo);
  }

  /* ---------- 지도 위 동그란 버튼 (정보, 가운데로) ---------- */
  .fab{
    position:absolute; right:12px; z-index:5; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--pill); color:var(--pillInk);
    font:700 18px/1 "Noto Sans KR",system-ui,sans-serif; display:grid; place-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.18); cursor:pointer; padding:0;
  }
  #infoBtn{ top:calc(12px + env(safe-area-inset-top)); }
  #homeBtn{ top:calc(62px + env(safe-area-inset-top)); }

  /* ---------- 정보 창: 측정 근거 ---------- */
  .panel{
    position:absolute; z-index:6; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top));
    max-width:520px; margin:0 auto; max-height:calc(100% - 24px - env(safe-area-inset-top));
    overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px 16px; box-shadow:0 8px 28px rgba(0,0,0,.25);
  }
  .panel.hide{ display:none; }
  .panel h2{ font-size:15px; font-weight:700; margin:0 36px 4px 0; }
  .panel .x{ position:absolute; top:8px; right:8px; width:34px; height:34px; border:0; border-radius:50%;
             background:transparent; color:var(--muted); font-size:22px; cursor:pointer; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px; }
  th{ font-weight:500; color:var(--muted); text-align:left; padding:5px 4px 5px 0; border-bottom:1px solid var(--line); }
  td{ padding:5px 4px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .hint{ font-size:12px; color:var(--muted); line-height:1.6; margin:10px 0 0; }
  .note{ font-size:12px; color:var(--muted); line-height:1.6; margin:10px 0 0; }

  /* ---------- 화면 맨 아래 시계: 지도를 확대해도 크기 그대로 ---------- */
  .clockbar{
    flex:none; position:relative; z-index:10; touch-action:none;
    background:#000; color:#fff; text-align:center;
    padding:14px 12px calc(12px + env(safe-area-inset-bottom));
    font-variant-numeric:tabular-nums;
  }
  .clockbar .t{ font-size:46px; font-weight:700; line-height:1.05; letter-spacing:1px; }
  .clockbar .t small{ font-size:30px; font-weight:700; }
  .clockbar .p{ font-size:12px; color:#9a9a9a; margin-top:4px; }
</style>
</head>
<body class="day">

<div class="viewer" id="viewer">
  <div class="pz" id="pz"><div class="stage" id="stage"></div></div>

  <button class="fab" id="infoBtn" aria-label="측정 근거 보기">i</button>
  <button class="fab" id="homeBtn" aria-label="오거리 가운데로">⌖</button>

  <div class="panel hide" id="panel">
    <button class="x" id="panelClose" aria-label="닫기">×</button>
    <h2>신호 계획 · 측정 근거</h2>
    <table>
      <thead><tr><th>시간대 (한국 시각)</th><th>주기</th><th>기준 (실측)</th></tr></thead>
      <tbody id="segTable"></tbody>
    </table>
    <table>
      <thead><tr><th>횡단보도</th><th>녹색</th><th>다음 신호까지 (주간 / 야간)</th></tr></thead>
      <tbody id="cwTable"></tbody>
    </table>
    <p class="hint">켜지는 순서: 5 → 1 → 2 → 3 → 4 → 다시 5. 지금은 하루 종일 180초 하나로 계산합니다.</p>
    <p class="note">계산값이라 실제 신호와 다를 수 있습니다. 건널 때는 반드시 실제 신호등을 보세요.</p>
  </div>
</div>

<div class="clockbar"><div class="t" id="clock">--:--:--<small>.-</small></div><div class="p" id="plan"></div></div>

<script src="index1.js"></script>
</body>
</html>
